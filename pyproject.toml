[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samg-mueller"
version = "0.1.0"
description = "Stokes-aware variational models and latent generators for Mueller polarimetry"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ayoub OULAD ALI"},
]
keywords = [
  "mueller-matrix",
  "polarimetry",
  "stokes-vector",
  "variational-autoencoder",
  "flow-matching",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
]
plots = ["matplotlib>=3.8"]

[project.scripts]
samg-make-synthetic = "samg.cli.synthetic:main"
samg-train = "samg.cli.train:main"
samg-evaluate = "samg.cli.evaluate:main"
samg-train-generator = "samg.cli.train_generator:main"
samg-sample-generator = "samg.cli.sample_generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
samg = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
